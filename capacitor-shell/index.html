<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Rajlo Driver</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f10100;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #ffffff;
        -webkit-user-select: none;
        user-select: none;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
        padding: 28px;
        box-sizing: border-box;
      }
      .logo {
        font-size: 44px;
        font-weight: 900;
        letter-spacing: -0.04em;
        margin-bottom: 28px;
      }
      .logo .o {
        color: #111906;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 21px;
        font-weight: 800;
        margin: 0 0 10px;
      }
      .msg {
        font-size: 14px;
        max-width: 320px;
        line-height: 1.55;
        opacity: 0.92;
        margin: 0;
      }
      .status {
        margin-top: 22px;
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13px;
        font-weight: 600;
        opacity: 0.85;
        min-height: 20px;
      }
      .spinner {
        width: 18px;
        height: 18px;
        border: 2.5px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      button {
        margin-top: 26px;
        background: #ffffff;
        color: #111906;
        border: 0;
        border-radius: 999px;
        padding: 13px 30px;
        font-size: 15px;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.97);
      }
      button:disabled {
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <!--
      Offline / connection-failure screen for the Rajlo Driver native
      shell. Capacitor loads this (via server.errorPath in
      capacitor.config.ts) whenever the WebView cannot reach the live
      driver portal — instead of the raw Chrome "Webpage not available"
      error. It polls for connectivity and, the moment the device is
      back online and the server is reachable, navigates straight back
      into the live app. The driver never sees a broken-looking error.
    -->
    <div class="wrap">
      <div class="logo">Rajl<span class="o">o</span> Driver</div>
      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
      <h1>No internet connection</h1>
      <p class="msg">
        Rajlo Driver needs an internet connection to work. We&rsquo;ll
        reconnect you automatically the moment you&rsquo;re back online.
      </p>
      <div class="status" id="status">
        <span class="spinner"></span>
        <span id="statusText">Waiting for connection&hellip;</span>
      </div>
      <button id="retry" type="button">Try again</button>

    <script>
      (function () {
        // The live portal the native shell wraps. Keep in sync with
        // server.url in capacitor.config.ts.
        var TARGET = "https://driver.rajlo.com/driver";
        var statusText = document.getElementById("statusText");
        var retryBtn = document.getElementById("retry");
        var checking = false;

        function goOnline() {
          statusText.textContent = "Back online — loading Rajlo…";
          // replace() so the offline screen isn't left in history.
          window.location.replace(TARGET);
        }

        // A no-cors fetch resolves (opaque response) when the request
        // reaches the network and rejects when the device is offline.
        // We don't need to read the response — success alone proves
        // connectivity, so cross-origin/CORS is irrelevant here.
        function probe() {
          if (checking) return;
          checking = true;
          fetch(TARGET, { mode: "no-cors", cache: "no-store" })
            .then(function () {
              goOnline();
            })
            .catch(function () {
              checking = false;
            });
        }

        // Poll every 3s, plus react instantly to the OS online event.
        setInterval(probe, 3000);
        window.addEventListener("online", probe);

        retryBtn.addEventListener("click", function () {
          statusText.textContent = "Checking…";
          probe();
        });

        // First attempt straight away.
        probe();
      })();
    </script>
    </div>
  </body>
</html>
